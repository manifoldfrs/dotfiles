# Installed to /etc/systemd/system/rex-login-server.service.d/ by scripts/rex_server_setup.sh.
# ExecStart is the packaged command line plus the tailnet listener; the setup
# script refuses to install it if the package's command line has changed.
[Unit]
After=tailscaled.service
Requires=tailscaled.service

[Service]
ExecStart=
ExecStart=/usr/bin/rex login-server --listen unix:///run/rex/login-server.sock --accounts /etc/rex/accounts.jsonc --runtime-root /run/rex --log-format text --pam-service rex-login-server --extra-listen tailnet://:7297
