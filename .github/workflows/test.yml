name: Test Dotfiles

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install required validation tools
        run: brew install bash fish fzf atuin zoxide neovim ripgrep stow

      - name: Validate shell syntax
        run: bash -n scripts/bootstrap.sh scripts/backup.sh scripts/stow.sh test/run_tests.sh mcp_setup.sh stow/bash/.bash_profile stow/bash/.bashrc stow/bash/.config/bash/*.bash

      - name: Check Git portability
        run: |
          ! grep -E '^\s*insteadOf\s*=' stow/git/.gitconfig
          ! grep -E '^\s*sshCommand\s*=' stow/git/.gitconfig

      - name: Verify Bash Stow layout
        run: |
          tmp_home="$(mktemp -d)"
          stow --no-folding -R -t "$tmp_home" -d stow bash git ghostty herdr nvim bin pi claude opencode codex
          test -L "$tmp_home/.bashrc"
          test -L "$tmp_home/.inputrc"
          test -L "$tmp_home/.config/bash/environment.bash"
          test -L "$tmp_home/.config/fish/config.fish"
          test -L "$tmp_home/.config/nvim/init.lua"
          test -L "$tmp_home/.config/herdr/config.toml"
          test -L "$tmp_home/.pi/agent/themes/tokyonight-frsh.json"
          test -L "$tmp_home/.pi/agent/AGENTS.md"
          test -L "$tmp_home/.pi/agent/guardrails/block-dangerous-bash.sh"
          test ! -e "$tmp_home/.pi/skills"
          test ! -e "$tmp_home/.pi/agent/hooks"
          test -L "$tmp_home/.claude/settings.json"
          test -L "$tmp_home/.claude/AGENTS.md"
          test -L "$tmp_home/.config/opencode/opencode.jsonc"
          test -L "$tmp_home/.config/opencode/AGENTS.md"
          test ! -e "$tmp_home/.claude/skills"
          test -L "$tmp_home/.codex/hooks/block-dangerous-bash.sh"
          test ! -e "$tmp_home/AGENTS.md"
          echo "STOW_TEST_HOME=$tmp_home" >> "$GITHUB_ENV"

      # Headless Neovim exits 0 after command errors, so the Lua check turns errors into a failing exit.
      - name: Require Neovim config and theme startup
        run: |
          cd "$STOW_TEST_HOME"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME HOME="$STOW_TEST_HOME" \
            nvim --headless '+Lazy! restore' '+colorscheme tokyonight' \
            "+lua if vim.v.errmsg ~= '' or not (vim.g.colors_name or ''):match('^tokyonight') then io.stderr:write('Neovim startup failed: ' .. vim.v.errmsg .. '\n') vim.cmd.cquit() end" \
            +qa

      - name: Run repository tests
        run: bash test/run_tests.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: test/package.json

      - name: Install Pi test dependencies
        working-directory: test
        run: pnpm install --frozen-lockfile

      - name: Install Pi for the X search runner tests
        run: |
          export PNPM_HOME="$RUNNER_TEMP/pnpm-global"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm add --global --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
          printf 'PNPM_HOME=%s\n' "$PNPM_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$PNPM_HOME/bin" >> "$GITHUB_PATH"

      - name: Run Pi tests
        working-directory: test
        run: pnpm test

      - name: Typecheck Pi extensions
        working-directory: test
        run: pnpm run typecheck

      - name: Check OpenCode plugins
        run: |
          for name in guardrails jev; do
            plugin="stow/opencode/.config/opencode/plugins/$name"
            pnpm --dir "$plugin" install --frozen-lockfile
            pnpm --dir "$plugin" run check
            pnpm --dir "$plugin" test
          done

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker tests
        run: |
          docker build -t dotfiles-test -f test/Dockerfile .
          docker run --rm dotfiles-test
