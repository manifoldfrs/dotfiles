name: Test Dotfiles

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install required validation tools
        run: brew install fish neovim ripgrep stow

      - name: Validate shell syntax
        run: |
          bash -n scripts/bootstrap.sh scripts/backup.sh scripts/stow.sh test/run_tests.sh mcp_setup.sh
          find stow/fish stow/fish-cb -name '*.fish' -print0 | xargs -0 -n1 fish -n

      - name: Check Git portability
        run: |
          ! grep -E '^\s*insteadOf\s*=' stow/git/.gitconfig
          ! grep -E '^\s*sshCommand\s*=' stow/git/.gitconfig

      - name: Verify Fish Stow layout
        run: |
          tmp_home="$(mktemp -d)"
          stow --no-folding -R -t "$tmp_home" -d stow fish git ghostty herdr nvim bin opencode claude codex pi amp agents
          test -L "$tmp_home/.config/fish/config.fish"
          test -L "$tmp_home/.config/fish/conf.d/catppuccin_macchiato_theme.fish"
          test -L "$tmp_home/.config/starship.toml"
          test -L "$tmp_home/.config/nvim/init.lua"
          test -L "$tmp_home/.config/herdr/config.toml"
          test -L "$tmp_home/.pi/agent/themes/catppuccin-macchiato.json"
          test -L "$tmp_home/.agents/skills/herdr/SKILL.md"
          test ! -e "$tmp_home/AGENTS.md"

      - name: Require Neovim theme startup
        run: nvim --headless '+Lazy! restore' '+colorscheme catppuccin-macchiato' +qa

      - name: Run repository tests
        run: bash test/run_tests.sh

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker tests
        run: |
          docker build -t dotfiles-test -f test/Dockerfile .
          docker run --rm dotfiles-test
