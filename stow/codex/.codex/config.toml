# Starter for ~/.codex/config.toml. Stow copies it on first setup.
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"

[tui]
theme = "heliotrope-haze"
status_line = ["model-with-reasoning", "current-dir", "thread-name", "context-used"]

[mcp_servers.jev]
command = "npx"
args = ["-y","@jkudish/jev-mcp@0.15.0"]
omit_tools_from = ["direct","deferred"]
env_vars = ["TYPESAFE_API_KEY"]

[mcp_servers.jev.tools.jev_verify]
approval_mode = "approve"

[mcp_servers.jev.tools.jev_screen]
approval_mode = "approve"

[mcp_servers.Ref]
url = "https://api.ref.tools/mcp"
omit_tools_from = ["deferred"]

[mcp_servers.Ref.env_http_headers]
x-ref-api-key = "REF_API_KEY"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa"
omit_tools_from = ["deferred"]

[mcp_servers.exa.env_http_headers]
x-api-key = "EXA_API_KEY"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y","chrome-devtools-mcp@latest","--isolated","--no-usage-statistics"]
tool_timeout_sec = 60
omit_tools_from = ["direct","deferred"]

[mcp_servers.superlogical]
url = "https://www.superlogical.com/rex/community-mcp"
omit_tools_from = ["direct","deferred"]

[mcp_servers.xai-search]
command = "/bin/sh"
args = ["-c", 'exec node "$HOME/.codex/mcp/xai-search.ts"']
env_vars = ["XAI_API_KEY","GROK_HOME"]
tool_timeout_sec = 310
omit_tools_from = ["deferred"]

[features]
hooks = true
code_mode = true
memories = true
