onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+a"
help = "prefix+?"
detach = "prefix+q"
reload_config = "prefix+r"

workspace_picker = ["prefix+s", "prefix+w"]
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+$"
close_workspace = "prefix+d"
previous_workspace = "prefix+("
next_workspace = "prefix+)"

new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"

# Match tmux: C-a % splits right and C-a " splits down.
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
copy_mode = "prefix+["
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected terminal text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as agent context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in the current folder"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "annotate.last"
description = "Review the agent's last reply"

[ui]
mouse_capture = true
right_click_passthrough_modifier = "ctrl"
confirm_close = true
prompt_new_tab_name = true
pane_borders = true
pane_gaps = true
agent_panel_sort = "priority"
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
pane_history = false

[advanced]
scrollback_limit_bytes = 10485760
